name: massage_flow
description: Flutter-first massage experience with an embedded Godot module.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/figma/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
